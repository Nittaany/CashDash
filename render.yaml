services:
  - type: web
    name: cashdash-api
    runtime: docker
    dockerfilePath: server/Dockerfile
    dockerContext: server
    region: oregon
    plan: free
    envVars:
      - key: PORT
        value: 5000
      - key: MONGODB_URI
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: CLIENT_URL
        value: https://cashdash.vercel.app
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: 1
      - key: COOKIE_SECURE
        value: true
      - key: COOKIE_SAMESITE
        value: none
    healthCheckPath: /api/health
    autoDeploy: true
